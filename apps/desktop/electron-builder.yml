# Clover's desktop app, packaged by electron-builder (lane M owns this file). `bun run dist` builds the unsigned,
# unpacked app on each OS (CI's app job; `--dir` overrides the targets below). The releases: the Linux packages (deb,
# rpm, AppImage) from `scripts/build-packages.ts`, the dmg and its update zip, and the Windows installer from
# `scripts/release/build.ts`, each with the daemon and its link sidecar inside. Signing, notarization and the update
# channel come from the release scripts' flags (scripts/release/lib.ts); nothing here holds a secret, and nothing is
# ever published from a build (`--publish never`): publishing is the owner's step (scripts/release/publish.ts).
appId: com.waifucave.clover
productName: Clover
copyright: Copyright © 2026 waifucave
directories:
  output: out/dist
  buildResources: build
files:
  - out/main/**
  - out/renderer/**
  - package.json
asar: true
# The daemon, clover-core, in the app's resources/daemon/, where E-M1's app starts it, and its link sidecar,
# clover-link (native/link), beside it, where the daemon starts that, and the binaries that run code not the core's own
# (scripts/bundled-binaries.ts): clover-plugin-bun, plain Bun for plugins, and on macOS lane A's clover-process-holder.
# scripts/build-packages.ts and scripts/release/build.ts stage them in out/daemon first. A plain `bun run dist` has
# none, and packages the app alone.
extraResources:
  - from: out/daemon
    to: daemon
    filter:
      - clover-core
      - clover-core.exe
      - clover-link
      - clover-link.exe
      - clover-plugin-bun
      - clover-plugin-bun.exe
      - clover-process-holder
  # The bundled plugins (the registry's `bundledDirs`, packages/core/src/registry): the repository's plugins/ as the
  # app's read-only resources/plugins, each subfolder one top-level plugin (`clover`, `alpha`). Only TRACKED files:
  # the release scripts stage `git ls-files plugins` in out/plugins first (scripts/release/bundled-plugins.ts), so
  # nothing else a working tree holds comes along, and no symlink. The core finds it beside its own daemon folder
  # (packages/core/src/bundled-plugins-dir.ts): Clover.app/Contents/Resources/plugins on macOS,
  # <install>\resources\plugins on Windows, /opt/Clover/resources/plugins in the Linux packages. A plain `bun run dist`
  # stages none, and packages the app without them.
  - from: out/plugins
    to: plugins
    # The stage is the BUILT tree (lane B's buildPluginForShipping, from the committed source): its node_modules hold
    # the natives, so only what never ships, built or not, is left out here.
    filter:
      - "**/*"
      - "!**/.env"
      - "!**/.env.*"
      - "!**/.DS_Store"
# The main process is one bundle with no runtime dependencies: nothing to rebuild or collect.
npmRebuild: false
nodeGypRebuild: false
buildDependenciesFromSource: false
# The update feed (scripts/release/lib.ts): electron-updater's GitHub provider over this public repository's releases,
# which the Homebrew cask and winget download from too. The channel is the release build's `-c.publish.channel`; for
# a full release the release build copies its update files to the beta names too, so beta users take stable releases
# (electron-builder writes only the channel it is given).
publish:
  provider: github
  owner: waifucave
  repo: clover
mac:
  # The dmg to install, and the zip electron-updater updates from. Apple silicon only (spec §3.1).
  target:
    - target: dmg
      arch: arm64
    - target: zip
      arch: arm64
  category: public.app-category.productivity
  artifactName: Clover-${version}-mac.${ext}
  # Unsigned unless the release signs it: `scripts/release/build.ts --sign` names the Developer ID identity and turns
  # notarization on (with notarytool's stored profile, APPLE_KEYCHAIN_PROFILE). The hardened runtime is on for both.
  identity: null
  notarize: false
  hardenedRuntime: true
  entitlements: ../../packaging/macos/entitlements.mac.plist
  entitlementsInherit: ../../packaging/macos/entitlements.mac.plist
  # The daemon, the link sidecar, plugin Bun and the process holder are signed by the release build itself, each with
  # its own identifier and entitlements (scripts/release/lib.ts, RESOURCE_BINARIES), before the app is sealed over them.
  signIgnore:
    - Contents/Resources/daemon/
  # A menu-bar app (spec §3.1: the pair is always on, with no window until the user opens one): no Dock icon.
  extendInfo:
    LSUIElement: true
win:
  # The per-user installer, x64 only. Unsigned at first (spec §13): with a certificate (electron-builder's
  # WIN_CSC_LINK and WIN_CSC_KEY_PASSWORD, at the owner's release) `scripts/release/build.ts --sign` signs the app and
  # the daemon and sidecar beside it, and sets the publisher electron-updater checks each update against.
  target:
    - target: nsis
      arch: x64
linux:
  target:
    - target: dir
  category: Utility
  # The app's own executable, /opt/Clover/clover; `clover` on the PATH is the daemon's command line
  # (packaging/linux/after-install.sh), as on macOS.
  executableName: clover
  synopsis: A bot-first, endlessly moddable desktop agent platform
  # The deb's Maintainer field and the rpm's Packager, the owner's contact: a name and an email, as Debian wants.
  maintainer: Clover <w@waifucave.com>
# The deb and the rpm are the main Linux packages: they install the AppArmor profile Electron's sandbox needs on
# Ubuntu (spec §4). Their scripts and the profile live in packaging/linux/. Besides electron-builder's own
# dependencies, the daemon's Bash tool needs bubblewrap (spec §4) and its secrets need libsecret.
# Both are named `clover`: electron-builder would otherwise name the file after the package.json name, whose
# `@waifucave/` scope puts a folder in the path (the first packages run failed on it).
deb:
  packageName: clover
  artifactName: clover_${version}_${arch}.${ext}
  # GNOME without the AppIndicator extension shows no tray, so the launcher entry carries Quit (spec §4): the app's
  # own executable with --quit (E-M1's app quits the pair). `clover` on the PATH is the daemon's command line.
  desktop:
    entry:
      Actions: Quit;
    desktopActions:
      Quit:
        Name: Quit Clover
        Exec: /opt/Clover/clover --quit
  afterInstall: ../../packaging/linux/after-install.sh
  afterRemove: ../../packaging/linux/after-remove.sh
  appArmorProfile: ../../packaging/linux/apparmor-profile
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0
    - bubblewrap
  recommends:
    - libappindicator3-1
    - gnome-keyring
rpm:
  packageName: clover
  artifactName: clover-${version}.${arch}.${ext}
  # The same Quit action as the deb's.
  desktop:
    entry:
      Actions: Quit;
    desktopActions:
      Quit:
        Name: Quit Clover
        Exec: /opt/Clover/clover --quit
  afterInstall: ../../packaging/linux/after-install.sh
  afterRemove: ../../packaging/linux/after-remove.sh
  appArmorProfile: ../../packaging/linux/apparmor-profile
  depends:
    - gtk3
    - libnotify
    - nss
    - libXScrnSaver
    - (libXtst or libXtst6)
    - xdg-utils
    - at-spi2-core
    - (libuuid or libuuid1)
    - libsecret
    - bubblewrap
# The AppImage is the fallback: it can't install the AppArmor profile, and the app copies the daemon out of it
# (spec §3.1, §4).
appImage:
  artifactName: Clover-${version}-${arch}.AppImage
# The release's names, which the Homebrew cask and winget point at (packaging/clover.rb.tmpl, packaging/winget/).
# (The zip takes the mac section's artifactName.)
dmg:
  artifactName: Clover-${version}.${ext}
# The Windows installer, once E-M1's app is there to package: per user, so its uninstall hook
# (packaging/windows/installer.nsh) runs as the user.
nsis:
  artifactName: Clover-Setup-${version}.${ext}
  oneClick: true
  perMachine: false
  include: ../../packaging/windows/installer.nsh
