name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, cowork/output-integration]
  # The merge queue: a queued pull request is tested again on top of the real latest main (and the PRs queued ahead of
  # it) before it lands, so two PRs that are each green against an older main can't break it together.
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

# One run per branch: a new push to a pull request cancels the run it supersedes (a run on main is never cancelled).
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# A-M1: the `@waifucave` scope (the agent SDK's packages, `@waifucave/clover-*`, `@waifucave/mochi2d` and the owner's
# other packages) comes from GitHub Packages, which wants a token even to read. Every job may read it with this
# workflow's own token (`packages: read`); the repo's `.npmrc` takes it from NODE_AUTH_TOKEN, which only the install
# steps are given, so no test or build step sees it. A job with its own `permissions:` block sets `packages: read`
# itself if it installs. A private package must also grant this repository Actions read access in its own package
# settings.
permissions:
  contents: read
  packages: read

# The Rust the link sidecar (native/link) builds with: the link job, the macos job's link leg and the packages.
env:
  RUST_TOOLCHAIN: 1.99.1
  CARGO_TERM_COLOR: never

jobs:
  # CI covers four machines (plan §3): macOS arm64, Windows x64, and Ubuntu x64 and arm64. On each it runs the
  # workspace packages' tests (the plugins' and services' among them), builds the daemon binary and builds the
  # unsigned app, whose window the UI test then opens (CI only: no app window on a developer's screen, plan §8): one
  # job per machine. The typecheck, the lockfile check, the galleries, the protocol codegen and the extension run
  # once, on Linux. Only what needs macOS runs there, in as few jobs as it can (the org's plan runs five macOS jobs at
  # once): one job for core, cli, the scripts and the compiled-binary gates (which need the agent runtime's
  # darwin-arm64 binary), and the Swift kits the iOS app links, only when apple/, the protocol's Swift, the core (whose
  # daemon WinterKit's tests start) or the toolchain changes.
  #
  # A pull request runs only the jobs whose inputs it changes (`changes`, scripts/ci-changes.ts); the names-and-layout
  # checks always run, and `gate` is the one check branch protection needs.

  # Which areas this change touches. A pull request compares its merge commit with the base it merges into, and a
  # merge-queue group its head with the main it was built on (every PR in the group); a push to main and a manual run
  # take every area, and so does a group whose base can't be fetched.
  changes:
    name: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      workspaces: ${{ steps.areas.outputs.workspaces }}
      daemon: ${{ steps.areas.outputs.daemon }}
      app: ${{ steps.areas.outputs.app }}
      packages: ${{ steps.areas.outputs.packages }}
      gallery: ${{ steps.areas.outputs.gallery }}
      typecheck: ${{ steps.areas.outputs.typecheck }}
      lockfiles: ${{ steps.areas.outputs.lockfiles }}
      extension: ${{ steps.areas.outputs.extension }}
      core: ${{ steps.areas.outputs.core }}
      cli: ${{ steps.areas.outputs.cli }}
      scripts: ${{ steps.areas.outputs.scripts }}
      codegen: ${{ steps.areas.outputs.codegen }}
      swift: ${{ steps.areas.outputs.swift }}
      verify: ${{ steps.areas.outputs.verify }}
      tree: ${{ steps.areas.outputs.tree }}
      link: ${{ steps.areas.outputs.link }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 2

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Which areas changed
        id: areas
        env:
          EVENT: ${{ github.event_name }}
          GROUP_BASE: ${{ github.event.merge_group.base_sha }}
        run: |
          case "$EVENT" in
            pull_request) bun scripts/ci-changes.ts --base HEAD^1 ;;
            merge_group)
              git fetch --no-tags --depth=1 origin "$GROUP_BASE" || true
              bun scripts/ci-changes.ts --base "$GROUP_BASE" ;;
            *) bun scripts/ci-changes.ts --all ;;
          esac

  # Always, whatever changed: the rename's residue and the live install's names over every tracked file, the rename's
  # rules, the layout's conventions and the CI areas. On Linux, in a minute or two, so a docs-only or report-only change
  # still runs them.
  names:
    name: names and layout
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: The residue and the live install's names
        working-directory: packages/core
        run: bun test test/rename/

      - name: The rename's rules, the layout, the workspaces and the CI areas
        run: bun test scripts/rename/ scripts/layout.test.ts scripts/workspaces.test.ts scripts/ci-changes.test.ts

  # One job per machine (macOS arm64, Linux x64 and arm64, Windows x64), each step run only when this change needs it:
  #  - every workspace package's `test` (docs/clover-layout.md): `scripts/workspaces.ts` runs each one that has the
  #    script, where its `cloverCi.os` allows, and skips core and cli (`cloverCi.ownJob`). On Linux the tests run under
  #    a private D-Bus session with a gnome-keyring of their own, so the harness's throwaway Secret Service store never
  #    meets a real keyring.
  #  - the daemon binary, `clover-core`, built for the machine's own target (`scripts/build-daemon.ts`: packages/cli's
  #    compile:core with the target set), then run once with `--version` on a temp home: it prints and exits, so no
  #    daemon starts. Unsigned on every OS; signing is M2's.
  #  - the app (apps/desktop), built and packaged unsigned and unpacked by electron-builder (`bun run build:app`), then
  #    the UI test opens it twice, under Electron and as the packaged app, and reads back its one sandboxed window.
  #    Linux runs it under xvfb, with unprivileged user namespaces allowed again for Chromium's sandbox (Ubuntu 24.04's
  #    AppArmor turns them off by default).
  # One job, not three, so a macOS runner (five at once on the org's plan) is taken once per change, not three times.
  # A later part still runs after an earlier one fails, so one run reports all three.
  machine:
    name: ${{ matrix.target }} (workspaces, daemon, app)
    needs: changes
    if: needs.changes.outputs.workspaces == 'true' || needs.changes.outputs.daemon == 'true' || needs.changes.outputs.app == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: darwin-arm64, runner: macos-latest }
          - { target: linux-x64, runner: ubuntu-24.04 }
          - { target: linux-arm64, runner: ubuntu-24.04-arm }
          - { target: windows-x64, runner: windows-latest }
    env:
      WORKSPACES: ${{ needs.changes.outputs.workspaces }}
      DAEMON: ${{ needs.changes.outputs.daemon }}
      APP: ${{ needs.changes.outputs.app }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: The private Secret Service's tools and the display (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends dbus gnome-keyring libsecret-1-0 xvfb xauth

      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Workspaces · test
        if: env.WORKSPACES == 'true' && runner.os != 'Linux'
        run: bun scripts/workspaces.ts run test

      - name: Workspaces · test (on a private Secret Service)
        if: env.WORKSPACES == 'true' && runner.os == 'Linux'
        run: scripts/with-private-secret-service.sh bun scripts/workspaces.ts run test

      - name: Daemon · build clover-core for ${{ matrix.target }}, and run its --version
        if: ${{ !cancelled() && env.DAEMON == 'true' }}
        run: bun scripts/build-daemon.ts --target ${{ matrix.target }} --smoke

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() && env.DAEMON == 'true' }}
        with:
          name: clover-core-${{ matrix.target }}
          path: dist/daemon/${{ matrix.target }}/
          retention-days: 5
          if-no-files-found: error

      - name: App · build the unsigned app
        id: app-build
        if: ${{ !cancelled() && env.APP == 'true' }}
        run: bun run build:app

      - name: App · UI test
        if: ${{ !cancelled() && steps.app-build.outcome == 'success' && runner.os != 'Linux' }}
        working-directory: apps/desktop
        env:
          CLOVER_UI_TESTS: "1"
        run: bun test test/ui-smoke.test.ts

      - name: App · the sandbox (Linux)
        if: ${{ !cancelled() && steps.app-build.outcome == 'success' && runner.os == 'Linux' }}
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: App · UI test (under xvfb)
        if: ${{ !cancelled() && steps.app-build.outcome == 'success' && runner.os == 'Linux' }}
        working-directory: apps/desktop
        env:
          CLOVER_UI_TESTS: "1"
        run: xvfb-run -a bun test test/ui-smoke.test.ts

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() && steps.app-build.outcome == 'success' }}
        with:
          name: clover-app-${{ matrix.target }}
          path: apps/desktop/out/dist/
          retention-days: 5
          if-no-files-found: error

  # The galleries: every workspace package with a `gallery` script (a plugin's parts, the base theme) builds its
  # gallery and renders each story to PNGs under $CLOVER_GALLERY_OUT/<its folder name>, light and dark, with a renderer
  # it brings itself (docs/clover-layout.md). They replace the lanes' own gallery workflows. Linux, so every gallery
  # renders with the same fonts; the PNGs are kept as one artifact for review.
  gallery:
    name: gallery
    needs: changes
    if: needs.changes.outputs.gallery == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and render every gallery
        env:
          CLOVER_GALLERY_OUT: ${{ runner.temp }}/gallery
        run: bun scripts/workspaces.ts run gallery

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gallery
          path: ${{ runner.temp }}/gallery
          retention-days: 14
          if-no-files-found: error

  # The Linux packages (plan §4 M1): the deb, the rpm and the AppImage of the app with the daemon inside, for x64 and
  # arm64, built on one x64 machine and opened to check what they hold (scripts/build-packages.ts --check). Then the
  # x64 deb is installed on this runner, checked (`clover` is the daemon's command line, the AppArmor profile is in)
  # and removed (both are gone). Nothing is uploaded: the packages are unsigned skeletons until M2.
  packages:
    name: packages · linux-${{ matrix.arch }} (deb, rpm, AppImage)
    needs: changes
    if: needs.changes.outputs.packages == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    # One job per architecture, on that architecture's machine: the link sidecar, clover-link, is Rust (with ring's C),
    # and builds for the machine it is on (scripts/build-packages.ts).
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, runner: ubuntu-24.04, deb: amd64 }
          - { arch: arm64, runner: ubuntu-24.04-arm, deb: arm64 }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch; the version is RUST_TOOLCHAIN
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: native/link -> target

      - name: rpmbuild, for the rpm
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends rpm

      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and check the packages
        run: bun scripts/build-packages.ts --arch ${{ matrix.arch }} --check

      - name: Install the deb, check it, and remove it
        run: |
          deb=$(ls apps/desktop/out/dist/*_${{ matrix.deb }}.deb)
          name=$(dpkg-deb -f "$deb" Package)
          sudo apt-get install -y -qq "./$deb"
          test "$(readlink -f /usr/bin/clover)" = /opt/Clover/resources/daemon/clover-core
          CLOVER_HOME="$(mktemp -d)" clover --version
          test -x /opt/Clover/resources/daemon/clover-link
          test -f /etc/apparmor.d/clover
          sudo apt-get remove -y -qq "$name"
          test ! -e /usr/bin/clover
          test ! -e /etc/apparmor.d/clover

  # The tree and the computers (J-M1) on Linux and Windows: the core's tree and computers tests, with lane B's
  # conformance suites run against the real code, and several computers on the fake link. macOS runs them in the core
  # suite (the macos job), so this job is the other two OSes' only run of them. It was spike-s6.yml's `tree` job (R6).
  tree:
    name: tree · ${{ matrix.runner }}
    needs: changes
    if: needs.changes.outputs.tree == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: The tree and the computers, with lane B's conformance suites
        working-directory: packages/core
        run: bun test --timeout 30000 test/tree test/computers src/contracts/tests/tree.test.ts src/contracts/tests/computer-registry.test.ts

  # The link sidecar (native/link, lane H's clover-link, iroh) on Windows and Linux, x64 and arm64: it is built, and
  # the core's link tests run over it on loopback (src/links/tests/sidecar.test.ts: pairing, a request, a 3 MiB
  # stream, a revoke, a key the core didn't allow). Nothing leaves the runner: the relay is off and the endpoints bind
  # 127.0.0.1. macOS runs the same in the macos job, which keeps the macOS jobs a change takes to three. It was
  # link.yml's `sidecar` job.
  link:
    name: link · ${{ matrix.runner }}
    needs: changes
    if: needs.changes.outputs.link == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-latest, ubuntu-24.04, ubuntu-24.04-arm]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch; the version is RUST_TOOLCHAIN
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: native/link -> target

      - name: Build clover-link
        run: cargo build --release --locked --manifest-path native/link/Cargo.toml

      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: The link tests over the sidecar
        working-directory: packages/core
        env:
          CLOVER_LINK_BIN: ${{ github.workspace }}/native/link/target/release/clover-link${{ runner.os == 'Windows' && '.exe' || '' }}
          CLOVER_LINK_REQUIRE_BINARY: "1"
        run: bun test --timeout 60000 src/links

  # P8b-9: `bun test` does not typecheck — bun strips types and runs, so a compile error in a project nobody
  # compiles is not a tripwire (the protocol checklist's step 4 trap, `satisfies Record<SessionEvent["type"],
  # boolean>`, fails core's tsc when a `SessionEvent` variant is added). `bun run typecheck` is every workspace
  # package's own `typecheck` (core, cli, protocol, plugin-sdk, the test harness, the app, the services: each
  # named in the log as it runs), the page runtime and the repo's scripts.
  typecheck:
    name: typecheck
    needs: changes
    if: needs.changes.outputs.typecheck == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Typecheck
        run: bun run typecheck

  # The two lockfiles agree with the manifests: bun.lock (the install above every job fails on drift) and
  # pnpm-lock.yaml, which the pnpm scripts and the browser extension use. Resolution only: nothing installed.
  lockfiles:
    name: lockfiles
    needs: changes
    if: needs.changes.outputs.lockfiles == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: bun.lock
        run: bun install --frozen-lockfile --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: pnpm-lock.yaml
        run: npx --yes pnpm@10.33.0 install --frozen-lockfile --lockfile-only
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Winter for Chrome (extensions/winter-for-chrome): the MV3 extension's typecheck and its unit tests (the CDP guard,
  # the controller over a fake browser, the native port, the manifest and the build — which renders the icons with the
  # workspace's resvg and fails on any call that would move the user's view). It is not a pnpm/bun package anything
  # imports, so it has its own job.
  test-extension:
    name: test · winter-for-chrome
    needs: changes
    if: needs.changes.outputs.extension == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Typecheck
        working-directory: extensions/winter-for-chrome
        run: ../../node_modules/.bin/tsc --noEmit -p .

      - name: Test
        working-directory: extensions/winter-for-chrome
        run: bun test

  # P9a-8: the `winter-binary` job (P8b-2: build the `winter` binary from the pinned-tag SDK
  # checkout, upload it as an artifact, every consumer downloads it) is DELETED — its ONLY source is the installed
  # npm platform package (`@yanlinglabs/winter-agent-sdk-darwin-arm64`, an optional dependency of
  # the wrapper that `bun install` resolves on darwin-arm64; published at v0.0.5). The 0.0.5 pin
  # flip removed the dated checkout+build fallback blocks and the `versions` job they consumed;
  # each job that needs the `winter` binary now FAILS LOUDLY if the package did not install.

  # The jobs that need the agent runtime's darwin-arm64 binary, as steps of ONE macOS job, each run only when this
  # change needs it, and each still run after an earlier one fails, so one run reports them all:
  #  - core's suite and cli's non-TUI tests (`test/*.ts` only — `test/tui/**` renders the Ink transcript through
  #    ink-testing-library and has ~30 pre-existing failures on main; widen back to a bare `bun test` the moment that
  #    suite is fixed). Their package.json says `cloverCi.ownJob`, so the other packages' tests stay independent of
  #    the `winter` binary: a broken platform package must not hold them up. CLOVER_RUNTIME_REQUIRE_BINARY=1 is the
  #    point of the binary: without it, every test that needs a real `winter` child SKIPS (core's real-child projector
  #    test, cli's session tests in client.test.ts), and CI would go green by proving nothing. Since A-M1 core's session
  #    tests run on the embedded runtime; those two still spawn the binary.
  #  - the repo's own scripts' tests (`scripts/**/*.test.ts`): the layout's conventions, the build, dev and release
  #    tools' pure halves, the held scripts, the limiter, the rename's codemod. None builds an app or starts a
  #    daemon. `embed-runtimes.test.ts` stages the agent runtime's binary from dist/.
  #  - the compiled-binary proofs (Winter Phase 8d, P8d-5): verify:workflow, verify:automation-worker,
  #    verify:runtime-state, verify:fd-receiver and verify:runtimes, which resolves the `winter` binary through its
  #    own ladder (the installed platform package first).
  # One job, not four, so a macOS runner (five at once on the org's plan) is taken once per change.
  macos:
    name: macOS (core, cli, scripts, verify, link)
    needs: changes
    if: needs.changes.outputs.core == 'true' || needs.changes.outputs.cli == 'true' || needs.changes.outputs.scripts == 'true' || needs.changes.outputs.verify == 'true' || needs.changes.outputs.link == 'true'
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      CORE: ${{ needs.changes.outputs.core }}
      CLI: ${{ needs.changes.outputs.cli }}
      SCRIPTS: ${{ needs.changes.outputs.scripts }}
      VERIFY: ${{ needs.changes.outputs.verify }}
      LINK: ${{ needs.changes.outputs.link }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      # The link job's macOS leg (link: clover-link built, the core's link tests over it).
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch; the version is RUST_TOOLCHAIN
        if: env.LINK == 'true'
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: env.LINK == 'true'
        with:
          workspaces: native/link -> target

      - name: Build clover-link
        if: env.LINK == 'true'
        run: cargo build --release --locked --manifest-path native/link/Cargo.toml

      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # P9a-8: `bun install` above must have brought the winter platform package (the same
      # dual-hop resolver the daemon's ladder uses); absent = a loud failure, never a fallback.
      - name: Check for the installed winter platform package (P9a-8)
        id: clover-package
        working-directory: packages/core
        run: |
          BIN=$(bun -e '
          import { resolvePlatformPackageWinter } from "./src/runtime-sdk/executable";
          console.log(resolvePlatformPackageWinter() ?? "");
          ')
          echo "bin=${BIN}" >> "$GITHUB_OUTPUT"
          if [ -n "$BIN" ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "::error::the winter platform package (@yanlinglabs/winter-agent-sdk-darwin-arm64 at REQUIRED_WINTER_AGENT_SDK) did not install — bun install is the ONLY winter source since the 0.0.5 pin flip (P9a-8)"; exit 1; fi

      - name: Use the installed platform package's winter binary (P9a-8 — the strong row-16 path)
        run: |
          mkdir -p dist
          cp "${{ steps.clover-package.outputs.bin }}" dist/winter
          chmod +x dist/winter

      - name: Core · test
        if: env.CORE == 'true'
        working-directory: packages/core
        env:
          CLOVER_RUNTIME_EXECUTABLE: ${{ github.workspace }}/dist/winter
          CLOVER_RUNTIME_REQUIRE_BINARY: "1"
        # The suite runs as 3 sequential native shards (`bun test --shard=K/3`, so discovery is bun's
        # own). They began as a guard against Bun 1.3.14's intermittent Worker use-after-free
        # ("Segmentation fault at address 0xA", exit 133, in one long process after ~70 Workers); on
        # 1.4.4 A-M1's dispatch soak ran 20 of 20 clean (6 of 20 crashed on 1.3.14). Memory is not why
        # they stay: neither Bun hands a terminated Worker's resident pages back (`ps -o rss=`), and on
        # 1.4.4 its dirty memory (phys_footprint) no longer piles up (packages/core/scripts/test-shards.ts
        # has the numbers). They stay because a smaller process is cheaper to re-run and keeps a crash to
        # one shard. Every shard is a fresh process in this directory:
        # same bunfig preload (per-process temp root, throwaway Keychain service), same env. The
        # script runs all shards (one that clearly crashed Bun - exit 133 or a signal, with no summary -
        # is re-run ONCE, with a ::warning::; a second crash fails), then fails the step on any non-zero or signal exit, a missing
        # "Ran N tests across M files" summary, a 0-file shard, or a file total below the glob count.
        run: bun scripts/test-shards.ts 3

      - name: CLI · test
        if: ${{ !cancelled() && env.CLI == 'true' }}
        working-directory: packages/cli
        env:
          CLOVER_RUNTIME_EXECUTABLE: ${{ github.workspace }}/dist/winter
          CLOVER_RUNTIME_REQUIRE_BINARY: "1"
        run: bun test test/*.ts

      - name: Scripts · test
        if: ${{ !cancelled() && env.SCRIPTS == 'true' }}
        run: bun test scripts

      - name: Link · the link tests over the sidecar
        if: ${{ !cancelled() && env.LINK == 'true' }}
        working-directory: packages/core
        env:
          CLOVER_LINK_BIN: ${{ github.workspace }}/native/link/target/release/clover-link
          CLOVER_LINK_REQUIRE_BINARY: "1"
        run: bun test --timeout 60000 src/links

      - name: verify:workflow
        if: ${{ !cancelled() && env.VERIFY == 'true' }}
        run: bun run verify:workflow

      # The ComputerV2 worker is the whole binary under its own seatbelt and a `{ PATH }`-only
      # environment: a module that throws at load there (2026-10-19, a load-time homedir()) takes
      # every ComputerV2 call down while verify:workflow, with its own profile, still passes.
      - name: verify:automation-worker
        if: ${{ !cancelled() && env.VERIFY == 'true' }}
        run: bun run verify:automation-worker

      - name: verify:runtime-state
        if: ${{ !cancelled() && env.VERIFY == 'true' }}
        run: bun run verify:runtime-state

      # N2 S7B: the Cowork native pair's packaging gate. Builds the real launcher (swift build, scratch path), embeds it with a stand-in worker into a
      # scratch bundle (ad hoc), accepts it and proves seven refusals. Never runs either binary, never signs with a real identity.
      - name: verify:cowork-native
        # Cowork is paused (spec §12): this runs on demand only (workflow_dispatch).
        if: ${{ !cancelled() && env.VERIFY == 'true' && github.event_name == 'workflow_dispatch' }}
        run: bun run verify:cowork-native

      # N2 S7B: the Cowork channel's receiver thread must start in the COMPILED daemon (a third compile:core entrypoint). Compiles clover-core and runs a temp copy's
      # probe on a socketpair; touches no home, Keychain, daemon or launcher.
      - name: verify:fd-receiver
        if: ${{ !cancelled() && env.VERIFY == 'true' }}
        run: bun run verify:fd-receiver

      # WS-23 (fix round 1, minor 6): the vendored ant, pinned and checksum-verified by fetch-ant
      # itself, so verify:runtimes exercises ant's bundle rung and its record's SHA against the pin
      # rather than skipping them.
      - name: Fetch the pinned ant
        if: ${{ !cancelled() && env.VERIFY == 'true' }}
        run: bun run scripts/fetch-ant.ts

      - name: verify:runtimes
        if: ${{ !cancelled() && env.VERIFY == 'true' }}
        run: bun run verify:runtimes

  # The protocol package generates a JSON schema and the Swift round-trip fixtures. If a schema
  # change landed without re-running the generator, the tree is dirty here — which is exactly the
  # drift the checklist in CONTRIBUTING.md exists to prevent.
  protocol-codegen:
    name: protocol codegen is committed
    needs: changes
    if: needs.changes.outputs.codegen == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Regenerate
        working-directory: packages/protocol
        run: bun run generate

      - name: Fail if the generated output differs from what is committed
        run: |
          if ! git diff --quiet; then
            echo "::error::Generated protocol artifacts are out of date. Run 'pnpm protocol:generate' and commit the result."
            git --no-pager diff --stat
            exit 1
          fi

  # Winter Phase 8d (P8d-5): the Swift mirror + client library, WITHOUT the full app (that stays a
  # local/STRETCH concern below — the app needs ~480MB of vendored CEF/LibreOffice/Monaco this job
  # does not fetch). WinterProtocol's round-trip tests assert the exact TS-generated fixture count;
  # WinterKit is built AND tested (CLAUDE.md's own protocol checklist step 7: `swift test` in
  # WinterProtocol alone does not catch a WinterKit-only compile break, e.g. a new SessionEvent
  # variant's exhaustive switch). The WinterKit socket-test flake class is KNOWN (real Unix-socket
  # I/O against a real spawned process on a shared CI runner) — retried once rather than chased.
  swift:
    name: swift (WinterProtocol + WinterKit + WinterChatKit + WinterBrowserHost)
    needs: changes
    if: needs.changes.outputs.swift == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Phase 8d (CI run 34683922033): WinterKit's daemon fixture is `/usr/bin/env bun -e …` and its
      # inline daemon imports @waifucave/clover-core, so this job needs bun on PATH AND the workspace installed —
      # without them ~17 WinterKit tests die with exit 127 before the JSON hello (green locally, red here).
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install dependencies (the WinterKit daemon fixture imports @waifucave/clover-core)
        run: bun install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: WinterProtocol — swift test
        working-directory: apple/WinterProtocol
        run: swift test

      - name: WinterKit — swift build
        working-directory: apple/WinterKit
        run: swift build

      # Winter Phase 8d (ruling P8d-22): thirteen Iroh-transport tests originally failed on `main`
      # with `IrohError ConnectionLost(LocallyClosed)` (P9a-11, Lane K: bisected to
      # `ed6ebeca6c1fce...`, "Dispatch on the Clover leg" — `session.dispatch`'s default mode
      # needs a resolvable `winter` executable, which `bun install` alone now provisions via the
      # npm platform package). Lane J (2026-09) fixed 4 of the remaining 5 by having the affected
      # tests settle a credential-less Clover-leg turn's real `turn_started`/`agent_error`/
      # `turn_completed` tail before asserting exact frame counts, instead of racing it (see those
      # tests' own doc comments and `RealDaemon.waitForFirstLine`'s). The last one,
      # `FakePhoneConformanceTests`' streaming test, was rebuilt (2026-09-30) around a fake OpenAI
      # Responses endpoint the daemon's real `openai` adapter streams from, so nothing is skipped.
      - name: WinterKit — swift test (retry once — known socket-test flake class)
        working-directory: apple/WinterKit
        run: swift test || (echo "::warning::WinterKit swift test failed once — retrying (known socket-test flake class)"; swift test)

      # WS-19 Lane I: the THIRD kit the phone links (WinterProtocol + WinterSessionKit +
      # WinterChatKit are the root umbrella's products) had no CI step at all — its ~338 tests ran
      # only on a developer's machine. It now carries one half of the credential decoder parity pair
      # (`apple/fixtures/ws19-credential-list*.json`, decoded against the same expected table by
      # WinterKitTests' CredentialsDecoderParityTests above), and a tripwire nobody runs is not a
      # tripwire. No skip list: this package opens no socket and spawns nothing, so it has none of
      # WinterKit's flake class.
      - name: WinterChatKit — swift test
        working-directory: apple/WinterChatKit
        run: swift test

      # Winter for Chrome's native host (apple/ComputerUse/WinterBrowserHost): framing, the relay, the daemon check
      # (fakes plus the real Security.framework decision against this process), identity. Imports nothing outside the
      # system, so it needs nothing above.
      - name: WinterBrowserHost — swift test
        working-directory: apple/ComputerUse/WinterBrowserHost
        run: swift test

  # The Cowork launcher (apple/Cowork/WinterCoworkLauncher) is its own Swift package and the `swift` job above never built it, so its tests ran only on a developer's machine.
  # Tests only, both configurations: the normal build, and the one with the compile-time test condition (it adds the tests that need the cdhash-pinned parent, which spawn the
  # package's own just-built launcher and FakeWorker as children of the test host: plain non-hypervisor processes, no VM, no libkrun, no sandbox call). Everything that signs
  # signs ad-hoc (`codesign --sign -`) in a temp directory; nothing touches a Keychain or `~/.clover*`. No bun, no workspace install: the package imports nothing but the system.
  swift-cowork-launcher:
    name: swift (WinterCoworkLauncher)
    # Cowork is paused (spec §12): this runs on demand only (workflow_dispatch).
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: WinterCoworkLauncher — swift test
        working-directory: apple/Cowork/WinterCoworkLauncher
        run: swift test --scratch-path "$RUNNER_TEMP/launcher-build"

      - name: WinterCoworkLauncher — swift test (WINTER_COWORK_TEST_BUILD)
        working-directory: apple/Cowork/WinterCoworkLauncher
        run: swift test --scratch-path "$RUNNER_TEMP/launcher-build-test" -Xswiftc -DWINTER_COWORK_TEST_BUILD

  # The libkrun production-profile patch queue (apple/Cowork/WinterCoworkLibkrun): fetch the pinned upstream source archive
  # (SHA-256 checked BEFORE it is extracted; the tree is data, nothing from inside it is run), compose the queue offline and
  # assert the pinned composed hash, then run the pure-Python guard tests including the composition test. No cargo, no
  # toolchain download, no archive build: that stays a local hash-pinned step (D7).
  # This workflow has no `paths` filters, so the scope check is the first step: the job always runs and reports a status
  # (success when the change is out of scope), so it can become a required check without ever being "skipped".
  libkrun-queue:
    name: libkrun patch queue
    # Cowork is paused (spec §12): this runs on demand only (workflow_dispatch). Skipped, the job reports success.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Is this change in scope?
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          run=true
          case "$EVENT" in
            pull_request) from="$BASE" ;;
            push) from="$BEFORE" ;;
            *) from="" ;;
          esac
          if [ -n "$from" ] && [ "$from" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$from^{commit}" 2>/dev/null; then
            if git diff --no-renames --name-only "$from" HEAD | grep -Eq '^(apple/Cowork/WinterCoworkLibkrun/|\.github/workflows/ci\.yml$)'; then run=true; else run=false; fi
          fi
          echo "run=${run}" >> "$GITHUB_OUTPUT"
          echo "libkrun queue checks in scope: ${run}"

      - name: Fetch the pinned upstream source (SHA-256 verified before extraction)
        if: steps.scope.outputs.run == 'true'
        working-directory: apple/Cowork/WinterCoworkLibkrun
        run: python3 -I -B scripts/fetch_inputs.py --source-only

      - name: Compose the queue offline and assert the composed hash
        if: steps.scope.outputs.run == 'true'
        working-directory: apple/Cowork/WinterCoworkLibkrun
        run: |
          python3 -I -B scripts/prepare_queue.py > "$RUNNER_TEMP/prepare.json"
          python3 -I -B -c "
          import json
          d = json.load(open('$RUNNER_TEMP/prepare.json'))
          assert d['fullSourceDiffSha256'] == '7ec7dd847bc09373d02ffe23894ca9f6ddebf2c992f8dbd2f251127823be5f24', d
          print('composed hash ok', d['fullSourceDiffSha256'])"

      - name: Guard tests (including the composition test)
        if: steps.scope.outputs.run == 'true'
        working-directory: apple/Cowork/WinterCoworkLibkrun
        run: python3 -I -B tests/test_queue_guards.py

  # The one check branch protection needs: it passes when every job above passed or was skipped because this change
  # does not touch its inputs, and fails when any failed or was cancelled.
  gate:
    name: gate
    if: always()
    needs: [changes, names, machine, packages, tree, link, gallery, typecheck, lockfiles, test-extension, macos, protocol-codegen, swift]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every job passed, or was not needed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")' > /dev/null
