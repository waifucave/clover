name: Lane G gallery

# Lane G's parts (the base theme, the island, the Dispatch pill, the VRM avatar, Alpha's tab): their
# tests on all three OSes, and the gallery of every part in every state rendered to PNGs with headless
# Chromium and software WebGL. Runs on the lane's branch only; each package installs on its own until
# the workspace globs land (lane M).

on:
  push:
    branches: [lane/g-m1]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lane-g-gallery-${{ github.ref }}
  cancel-in-progress: true

env:
  PACKAGES: >-
    plugins/clover/base-theme
    plugins/clover/island
  GALLERY: plugins/clover/base-theme/gallery

jobs:
  test:
    name: test · ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install, typecheck and test each package (no root workspace)
        run: |
          for p in $PACKAGES; do
            echo "::group::$p"
            (cd "$p" && bun install --frozen-lockfile && bun node_modules/typescript/bin/tsc --noEmit -p . && bun test) || exit 1
            echo "::endgroup::"
          done

  gallery:
    name: gallery · PNGs
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install the parts and the gallery
        run: |
          for p in $PACKAGES $GALLERY; do
            (cd "$p" && bun install --frozen-lockfile) || exit 1
          done

      - name: Typecheck and build the gallery
        working-directory: ${{ env.GALLERY }}
        run: |
          bun node_modules/typescript/bin/tsc --noEmit -p .
          bun run build.ts

      - name: Install headless Chromium (CI only)
        working-directory: ${{ env.GALLERY }}
        run: node node_modules/playwright/cli.js install --with-deps chromium

      - name: Render every story to a PNG
        working-directory: ${{ env.GALLERY }}
        run: node render.mjs

      - name: Upload the gallery
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lane-g-gallery
          path: ${{ env.GALLERY }}/out/
          retention-days: 14
          if-no-files-found: error
