name: Lane F gallery

# Lane F's own checks, on its branches only: every part's tests and typecheck on all three OSes, and
# the gallery (whole-window screens and every part) rendered to PNGs with headless Chromium, light and
# dark, uploaded as the `lane-f-gallery` artifact for review. The parts are self-contained packages
# until the workspace globs land, so each installs its own dependencies. Lane M takes these checks
# into CI proper; until then this file stays.
on:
  push:
    branches: ['lane/f-*']
    paths: ['plugins/clover/**', '.github/workflows/lane-f-gallery.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lane-f-gallery-${{ github.ref }}
  cancel-in-progress: true

env:
  PARTS: conversation composer shell panel panel-terminal panel-diff panel-files panel-browser settings

jobs:
  test:
    name: test · ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install each part's dependencies
        run: for p in $PARTS; do (cd "plugins/clover/$p" && bun install --frozen-lockfile); done

      - name: Typecheck
        run: for p in $PARTS; do (cd "plugins/clover/$p" && echo "typecheck $p" && bun run typecheck); done

      - name: Test
        run: for p in $PARTS; do (cd "plugins/clover/$p" && bun test); done

  gallery:
    name: gallery PNGs
    runs-on: macos-15
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install each part's dependencies
        run: for p in $PARTS; do (cd "plugins/clover/$p" && bun install --frozen-lockfile); done

      - name: Build the gallery
        working-directory: plugins/clover/shell
        run: bun gallery/build.ts "$RUNNER_TEMP/lane-f-gallery/site"

      - name: Install Playwright and its Chromium (CI only)
        run: |
          node --version
          mkdir -p "$RUNNER_TEMP/lane-f-pw"
          cd "$RUNNER_TEMP/lane-f-pw"
          npm init -y > /dev/null
          npm install --no-audit --no-fund playwright@1.64.1
          npx playwright install chromium

      - name: Render every story to PNG, light and dark
        run: |
          cp plugins/clover/shell/gallery/shoot.mjs "$RUNNER_TEMP/lane-f-pw/shoot.mjs"
          node "$RUNNER_TEMP/lane-f-pw/shoot.mjs" "$RUNNER_TEMP/lane-f-gallery/site" "$RUNNER_TEMP/lane-f-gallery/png"
          {
            echo "### Lane F gallery"
            echo
            echo "$(ls "$RUNNER_TEMP/lane-f-gallery/png/light" | wc -l | tr -d ' ') stories, each in light and dark, in the \`lane-f-gallery\` artifact (\`png/\`), with the page itself (\`site/index.html\`)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the PNGs and the page
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lane-f-gallery
          path: ${{ runner.temp }}/lane-f-gallery
          retention-days: 30
          if-no-files-found: error
