# The Xcode project of the HELPERS the daemon launches: Winter Computer Use (+ the winter-browser-host tool it carries) and
# Winter Headless (+ the Chromium it embeds). The old Winter Mac app's own targets (the app, its tests, WinterHelper and
# the office helper) left this repository on 2026-11-15 (they stay on `winter/maintenance`); this folder keeps its name
# only because the scripts (`dev:helper`, `dev:headless`, `verify:computer-helper`, `embed-*.sh`, the release and fetch
# scripts) address it by that path. `Winter.xcodeproj` is GENERATED FROM THIS FILE AND IS NOT TRACKED (`.gitignore`
# beside this file) — so there is no committed project anyone can fix once, and whatever your working tree last
# generated is what a build uses.
#
# `xcodegen generate` BEFORE EVERY BUILD, and always before one that is meant to prove something.
# `sources: - path: Sources` is a DIRECTORY: xcodegen enumerates it at generate time, so a file added
# since the last generate is simply not in the target — it compiles nowhere, its tests do not exist,
# and the build goes green.
name: Winter
options:
  bundleIdPrefix: com.winter
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
packages:
  # ComputerV2: the Winter Computer Use helper's shell (and, through it, the automation engine and the
  # mirror/cursor/Esc packages). Only the WinterComputerUse target links the shell.
  WinterComputerUse:
    path: ../ComputerUse/WinterComputerUse
  # ComputerV2 Phase 2: winter-browser-host, the native-messaging host behind Winter for Chrome. Only the
  # WinterBrowserHost tool target links it; that tool is embedded in the helper's Contents/MacOS.
  WinterBrowserHost:
    path: ../ComputerUse/WinterBrowserHost
targets:
  # ComputerV2 — "Winter Computer Use", the helper app behind the ComputerV2 tool. An LSUIElement agent app
  # (no Dock icon, no menu) that holds its OWN Accessibility and Screen Recording grants, so it must be a
  # real .app launched through LaunchServices (`open -g -j`), never a child of winter-core or Winter.app —
  # TCC checks a child's responsible process, which would be the parent. Everything but `App/main.swift`
  # lives in the WinterComputerUse package (`swift test` there); it never links WinterKit.
  #
  # Identity by configuration, like the Winter target: Release = dist (`Winter Computer Use`,
  # com.winter.computeruse, serves ~/.winter, embedded in Winter.app by "Embed Winter Computer Use");
  # Debug = dev (`Winter Computer Use Dev`, com.winter.computeruse.dev, serves ~/.winter-dev), which
  # `bun run dev:helper` builds (giving the bundle id on its command line — see the Debug config), signs
  # with the stated designated requirement and places in dist/dev/. The helper reads its home from its own
  # bundle id. Exactly one entitlement, Apple Events (applescript() — Support/WinterComputerUse.entitlements;
  # checkSignedHelper and embed-computer-helper.sh pin exactly that one).
  WinterComputerUse:
    type: application
    platform: macOS
    sources:
      - path: ../ComputerUse/WinterComputerUse/App
      - path: Support/AppIcon.icns
      - path: Support/AppIconDev.icns
    dependencies:
      - package: WinterComputerUse
        product: WinterComputerUseShell
      # ComputerV2 Phase 2: build order only — the "Embed winter-browser-host" phase below copies the tool.
      - target: WinterBrowserHost
        embed: false
    # ComputerV2 Phase 2: winter-browser-host goes beside the helper's own executable, in Contents/MacOS. It is
    # nested code with its OWN identity (com.winter.browserhost[.dev]), so every signing site — dev:helper,
    # verify:computer-helper, embed-computer-helper.sh — signs it before it signs the helper (never --deep).
    postCompileScripts:
      - name: Embed winter-browser-host
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          SRC="${BUILT_PRODUCTS_DIR}/winter-browser-host"
          DEST="${TARGET_BUILD_DIR}/${EXECUTABLE_FOLDER_PATH}"
          if [ ! -f "${SRC}" ]; then
            echo "error: winter-browser-host is not at ${SRC} — is the WinterBrowserHost target in this build?" >&2
            exit 1
          fi
          mkdir -p "${DEST}"
          rm -f "${DEST}/winter-browser-host"
          cp "${SRC}" "${DEST}/winter-browser-host"
    info:
      path: ../ComputerUse/WinterComputerUse/Support/Info.plist
      properties:
        CFBundleName: "$(WINTER_CU_APP_NAME)"
        CFBundleDisplayName: "$(WINTER_CU_APP_NAME)"
        CFBundleIdentifier: "$(PRODUCT_BUNDLE_IDENTIFIER)"
        CFBundleIconFile: "$(WINTER_CU_APP_ICON)"
        # The helper's OWN version (semver, apple/ComputerUse/VERSION — not Winter's), stamped into these two
        # marked lines and the generated Info.plist by scripts/computer-helper-lib.ts's syncHelperVersion
        # (version:sync, dev:helper, verify:computer-helper); Winter's own stamp skips the marked lines. The
        # helper reports it as `helperVersion`.
        CFBundleShortVersionString: "1.22.0" # apple/ComputerUse/VERSION
        CFBundleVersion: "1.22.0" # apple/ComputerUse/VERSION
        LSUIElement: true
        LSMinimumSystemVersion: "26.0"
        NSScreenCaptureUsageDescription: "Winter Computer Use captures the windows Winter works in, and the screen when Winter is asked to look at it."
        NSAppleEventsUsageDescription: "Winter Computer Use runs AppleScript in the app Winter is working in, when you let it control that app."
    settings:
      base:
        PRODUCT_NAME: "$(WINTER_CU_APP_NAME)"
        CODE_SIGN_ENTITLEMENTS: ../ComputerUse/WinterComputerUse/Support/WinterComputerUse.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.winter.computeruse
        WINTER_CU_APP_NAME: Winter Computer Use
        WINTER_CU_APP_ICON: AppIcon
        CODE_SIGN_IDENTITY: "Apple Development"
        DEVELOPMENT_TEAM: 37N77U9RSZ
        CODE_SIGN_STYLE: Manual
        ENABLE_HARDENED_RUNTIME: YES
        # One Mach-O, in Debug too: Xcode's preview "debug dylib" split would put the code in a
        # `….debug.dylib` beside a stub executable, which the dev helper's own re-sign (one bundle signature,
        # hardened runtime, library validation) has no business carrying.
        ENABLE_DEBUG_DYLIB: NO
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "26.0"
      configs:
        Debug:
          # NOT com.winter.computeruse.dev: Xcode registers every app it builds with LaunchServices, and a
          # Debug Winter build compiles this target too, so each DerivedData would hold a second registered
          # com.winter.computeruse.dev — signed by Xcode, with a requirement TCC does not know — for
          # `open -b` to pick. The dev helper's identity is given only on `bun run dev:helper`'s command line
          # (PRODUCT_BUNDLE_IDENTIFIER=com.winter.computeruse.dev); this build of it refuses to start.
          PRODUCT_BUNDLE_IDENTIFIER: com.winter.computeruse.xcode-debug
          WINTER_CU_APP_NAME: Winter Computer Use Dev
          WINTER_CU_APP_ICON: AppIconDev
        Release:
          # The same privacy set as the Winter and WinterHelper targets (compiler-recorded paths, linker OSO
          # stabs, AST-path stabs): the release identity scan reads every byte of the helper too.
          OTHER_SWIFT_FLAGS: -file-prefix-map $(HOME)=/builder
          OTHER_LDFLAGS: -Wl,-oso_prefix,$(HOME)/
          DEPLOYMENT_POSTPROCESSING: YES
          STRIP_INSTALLED_PRODUCT: YES
          STRIP_STYLE: debugging
  # ComputerV2 Phase 2 — winter-browser-host, Chrome's native-messaging host for Winter for Chrome
  # (apple/ComputerUse/WinterBrowserHost, its PROTOCOL.md). A bare tool: Tool/main.swift on the package's library, copied
  # into the Winter Computer Use helper's Contents/MacOS by that target's "Embed winter-browser-host" phase. It reads its
  # home from the enclosing helper's bundle id, so it carries no identity of its own beyond its codesign identifier,
  # which every signing site states explicitly (com.winter.browserhost / .dev / .test, hardened runtime, no
  # entitlements, a stated designated requirement — scripts/computer-helper-lib.ts). Test hooks compile in only under
  # the test-build compilation condition, which only verify:computer-helper's test flavor passes.
  WinterBrowserHost:
    type: tool
    platform: macOS
    sources:
      - path: ../ComputerUse/WinterBrowserHost/Tool
    dependencies:
      - package: WinterBrowserHost
        product: WinterBrowserHostCore
    settings:
      base:
        PRODUCT_NAME: winter-browser-host
        PRODUCT_BUNDLE_IDENTIFIER: com.winter.browserhost
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "Apple Development"
        DEVELOPMENT_TEAM: 37N77U9RSZ
        CODE_SIGN_STYLE: Manual
        ENABLE_HARDENED_RUNTIME: YES
        OTHER_CODE_SIGN_FLAGS: -i com.winter.browserhost
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "26.0"
      configs:
        Release:
          # The helper's privacy set: the release identity scan reads every byte of the host too.
          OTHER_SWIFT_FLAGS: -file-prefix-map $(HOME)=/builder
          OTHER_LDFLAGS: -Wl,-oso_prefix,$(HOME)/
          DEPLOYMENT_POSTPROCESSING: YES
          STRIP_INSTALLED_PRODUCT: YES
          STRIP_STYLE: debugging
  # ComputerV2 Phase 4 — **Winter Headless**: Winter's private, invisible browser for the agent's background reading
  # (`browsers.open(url, { browser: "headless" })`). A background-only app (LSBackgroundOnly: no Dock tile, no menu bar,
  # no window) running only WINDOWLESS CEF browsers, one in-memory request context per Winter session. The daemon spawns
  # its executable directly (never through LaunchServices) with a pipe on fds 3/4 and drives it with the browser-link op
  # set (Sources/HeadlessHelper/HeadlessWire.swift); it exits when the pipe closes.
  #
  # Winter's ONE Chromium lives here (the user's ruling): the CEF framework and the five "Winter Helper" bundles are in
  # this app's own Contents/Frameworks ("Embed Winter's Chromium" below), and Winter.app — which nests this app at
  # Contents/Helpers/ in every configuration — runs its own CEF from here too. It compiles WinterCEF.mm (its windowless
  # additions) and loads the framework by path. WinterKit is not linked (it would drag Iroh in): the pure files of the browser link — the
  # wire vocabulary, the command parser, the CDP allowlist and the per-tab gate — are compiled in directly, so the helper
  # enforces the very same Swift copy of the allowlist and world rules Winter.app does.
  #
  # Identity: com.winter.headless (Release), com.winter.headless.dev (only `bun run dev:headless` gives it, through
  # WINTER_HEADLESS_DEBUG_BUNDLE_ID on its own command line — a setting only this target reads, so the CEF helper targets
  # it builds keep their own identifiers), com.winter.headless.xcode-debug for a plain Xcode Debug build. Hardened runtime, NO entitlements, a
  # stated designated requirement at every signing site (scripts/embed-headless-helper.sh, dev:headless). Built on its
  # own (`bun run dev:headless`) it is the dev helper, running outside Winter.app on the same Chromium it carries.
  WinterHeadless:
    type: application
    platform: macOS
    sources:
      - path: Sources/HeadlessHelper
      - path: Sources/HeadlessPresent/WinterPresentWire.h
      - path: Sources/HeadlessPresent/WinterPresentAuth.h
      - path: Sources/HeadlessPresent/WinterPresentAuth.m
      # The presentation's third-party notices (flutter_cef's MIT notice among them) ship in the helper that runs the
      # producer, as they do in Winter.app.
      - path: Sources/HeadlessPresent/THIRD_PARTY.md
        buildPhase: resources
      - path: Sources/CEF/WinterCEF.h
      - path: Sources/CEF/WinterCEF.mm
      - path: Sources/CEF/WinterCEFAssetResolve.h
      - path: Sources/CEF/WinterCEFAssetResolve.mm
      - path: Sources/CEF/WinterEditorBridge.h
      - path: Sources/CEF/WinterEditorScheme.h
      - path: Sources/HeadlessShared/JSONValue.swift
      - path: Sources/HeadlessShared/LineDecoder.swift
      - path: Sources/HeadlessShared/BrowserLinkProtocol.swift
      - path: Sources/HeadlessShared/BrowserLinkCommand.swift
      - path: Sources/HeadlessShared/CDPAllowlist.swift
      - path: Sources/HeadlessShared/CDPTabGate.swift
    dependencies:
      - sdk: libbsm.tbd
      - target: CefDllWrapper
      # Build order only: "Embed Winter's Chromium" copies them into this app's own Contents/Frameworks.
      - target: CEFHelperBase
        embed: false
      - target: CEFHelperAlerts
        embed: false
      - target: CEFHelperGPU
        embed: false
      - target: CEFHelperPlugin
        embed: false
      - target: CEFHelperRenderer
        embed: false
    postCompileScripts:
      # Winter's ONE Chromium (the user's ruling): the CEF framework and the five "Winter Helper" bundles live in THIS
      # helper's Contents/Frameworks, and Winter.app's own CEF runs from here too (its "Embed Winter Headless" phase nests
      # this whole app at Winter.app/Contents/Helpers/). Every Chromium subprocess enters a sandbox that reads only inside
      # its BROWSER process's main bundle: this bundle holds them for the helper's own browser, and Winter.app holds this
      # bundle for Winter's. Same recipe as Winter.app's embed used to be (see its history): the vendored framework copied
      # into the versioned macOS layout, its five Libraries/*.dylib signed first, then Versions/A — inside-out, with this
      # build's identity (library validation: same team), the hardened runtime, and a secure timestamp in Release
      # (notarization). The helper bundles arrive already signed by their own targets (the Renderer and GPU ones with
      # allow-jit). The stamp keeps an incremental build from re-copying 317 MB.
      - name: Embed Winter's Chromium
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          CEF_SRC="${SRCROOT}/vendor/cef/Release/Chromium Embedded Framework.framework"
          DEST_FRAMEWORKS="${BUILT_PRODUCTS_DIR}/${CONTENTS_FOLDER_PATH}/Frameworks"
          DEST="${DEST_FRAMEWORKS}/Chromium Embedded Framework.framework"
          STAMP="${TARGET_TEMP_DIR}/cef-framework.stamp"
          WANT="$(cat "${SRCROOT}/vendor/cef/.vendored-version")|${EXPANDED_CODE_SIGN_IDENTITY}|${CONFIGURATION}|recipe-3-one-chromium"
          TS=""
          if [ "${CONFIGURATION}" = "Release" ]; then TS="--timestamp"; fi
          mkdir -p "${DEST_FRAMEWORKS}" "${TARGET_TEMP_DIR}"
          if [ -d "${DEST}" ] && [ -f "${STAMP}" ] && [ "$(cat "${STAMP}")" = "${WANT}" ]; then
            echo "CEF framework already embedded and signed for this identity — skipping"
          else
            rm -f "${STAMP}"
            rm -rf "${DEST}"
            # An APFS clone where the volume allows it: a 300 MB copy that costs no space.
            cp -c -R "${CEF_SRC}" "${DEST}" 2>/dev/null || ditto "${CEF_SRC}" "${DEST}"
            if [ ! -d "${DEST}/Libraries" ] && [ ! -d "${DEST}/Versions" ]; then
              echo "error: vendored CEF framework is missing Libraries/ — re-check fetch-cef.ts" >&2
              exit 1
            fi
            if [ ! -d "${DEST}/Versions" ]; then
              mkdir -p "${DEST}/Versions/A"
              mv "${DEST}/Chromium Embedded Framework" "${DEST}/Libraries" "${DEST}/Resources" "${DEST}/Versions/A/"
              ln -s "A" "${DEST}/Versions/Current"
              ln -s "Versions/Current/Chromium Embedded Framework" "${DEST}/Chromium Embedded Framework"
              ln -s "Versions/Current/Libraries" "${DEST}/Libraries"
              ln -s "Versions/Current/Resources" "${DEST}/Resources"
            fi
            for LIB in "${DEST}/Versions/A/Libraries/"*.dylib; do
              codesign --force --sign "${EXPANDED_CODE_SIGN_IDENTITY}" --options runtime ${TS} "${LIB}"
            done
            codesign --force --sign "${EXPANDED_CODE_SIGN_IDENTITY}" --options runtime ${TS} "${DEST}/Versions/A"
            printf '%s' "${WANT}" > "${STAMP}"
          fi
          for NAME in "Winter Helper" "Winter Helper (Alerts)" "Winter Helper (GPU)" "Winter Helper (Plugin)" "Winter Helper (Renderer)"; do
            SRC="${BUILT_PRODUCTS_DIR}/${NAME}.app"
            if [ ! -d "${SRC}" ]; then
              echo "error: expected built CEF helper bundle not found at ${SRC}" >&2
              exit 1
            fi
            rm -rf "${DEST_FRAMEWORKS}/${NAME}.app"
            ditto "${SRC}" "${DEST_FRAMEWORKS}/${NAME}.app"
          done
    info:
      path: Support/WinterHeadless-Info.plist
      properties:
        CFBundleName: "$(WINTER_HEADLESS_APP_NAME)"
        CFBundleDisplayName: "$(WINTER_HEADLESS_APP_NAME)"
        CFBundleIdentifier: "$(PRODUCT_BUNDLE_IDENTIFIER)"
        CFBundleShortVersionString: "0.124.0"
        CFBundleVersion: "0.124.0"
        # No Dock tile, no menu bar, never activated: this process has no UI at all.
        LSBackgroundOnly: true
        LSMinimumSystemVersion: "26.0"
        # Never forces the discrete GPU on for a process nobody sees.
        NSSupportsAutomaticGraphicsSwitching: true
    settings:
      base:
        PRODUCT_NAME: "$(WINTER_HEADLESS_APP_NAME)"
        PRODUCT_BUNDLE_IDENTIFIER: com.winter.headless
        WINTER_HEADLESS_APP_NAME: Winter Headless
        WINTER_HEADLESS_DEBUG_BUNDLE_ID: com.winter.headless.xcode-debug
        CODE_SIGN_IDENTITY: "Apple Development"
        DEVELOPMENT_TEAM: 37N77U9RSZ
        CODE_SIGN_STYLE: Manual
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_DEBUG_DYLIB: NO
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "26.0"
        SWIFT_OBJC_BRIDGING_HEADER: Sources/HeadlessHelper/HeadlessBridge.h
        HEADER_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/vendor/cef
          - $(SRCROOT)/Sources/CEF
        CLANG_CXX_LANGUAGE_STANDARD: gnu++20
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: $(WINTER_HEADLESS_DEBUG_BUNDLE_ID)
          WINTER_HEADLESS_APP_NAME: Winter Headless Dev
        Release:
          # The helper's privacy set: the release identity scan reads every byte of it too.
          OTHER_SWIFT_FLAGS: -file-prefix-map $(HOME)=/builder
          OTHER_CPLUSPLUSFLAGS: -ffile-prefix-map=$(HOME)=/builder
          OTHER_CFLAGS: -ffile-prefix-map=$(HOME)=/builder
          OTHER_LDFLAGS: -Wl,-oso_prefix,$(HOME)/
          DEPLOYMENT_POSTPROCESSING: YES
          STRIP_INSTALLED_PRODUCT: YES
          STRIP_STYLE: debugging
  # Winter Headless's logic with no CEF and no host app (a logic-test bundle: nothing launches, nothing takes focus) —
  # the op executor against a fake driver, the pipe's wire and outbox, the layout and argument rules.
  WinterHeadlessTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/WinterHeadlessTests
      - path: Sources/HeadlessHelper/HeadlessHost.swift
      - path: Sources/HeadlessHelper/HeadlessCEFDriver.swift
      - path: Sources/HeadlessHelper/HeadlessWire.swift
      - path: Sources/HeadlessHelper/HeadlessLayout.swift
      - path: Sources/HeadlessHelper/HeadlessNetworkRule.swift
      - path: Sources/HeadlessShared/JSONValue.swift
      - path: Sources/HeadlessShared/LineDecoder.swift
      - path: Sources/HeadlessShared/BrowserLinkProtocol.swift
      - path: Sources/HeadlessShared/BrowserLinkCommand.swift
      - path: Sources/HeadlessShared/CDPAllowlist.swift
      - path: Sources/HeadlessShared/CDPTabGate.swift
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "26.0"
  # panel-cef Task 4 — CEF's own generated C++/C-API translation layer ("libcef_dll_wrapper" in
  # CEF's own CMakeLists.txt, vendored verbatim alongside include/ and Release/ by fetch-cef.ts).
  # CefExecuteProcess / CefScopedLibraryLoader / CefScopedSandboxContext — what the five helper
  # mains below call — are NOT header-only, unlike WinterApplication.mm's CefAppProtocol
  # conformance (Task 3, which needed zero CEF linkage): they're real translation units that live
  # here, and CefExecuteProcess alone pulls in a dozen more (app_cpptoc.h and friends) transitively.
  # Rather than hand-picking files and fighting CEF's own generated-code dependency web, this
  # target compiles the SAME file set CEF's own libcef_dll/CMakeLists.txt does — read directly
  # (it's vendored, not guessed): `add_library(libcef_dll_wrapper ...)` at CMakeLists.txt:818
  # compiles ALL of base/ + cpptoc/ (including cpptoc/test/ and cpptoc/views/) + ctocpp/ (including
  # ctocpp/test/ and ctocpp/views/) + wrapper/ — CEF does NOT trim test/views for a minimal embed,
  # measured by reading the file rather than assumed. `path: vendor/cef/libcef_dll` below is one
  # recursive glob for exactly that reason: it IS CEF's own file list, not a subset of it.
  CefDllWrapper:
    type: library.static
    platform: macOS
    sources:
      - path: vendor/cef/libcef_dll
        excludes:
          - CMakeLists.txt
    settings:
      base:
        HEADER_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/vendor/cef
        # Same requirement as WinterApplication.mm (Task 3): CEF 151's public headers need C++20
        # (std::same_as in cef_scoped_refptr.h:101; gnu++17 fails identically to the gnu++14
        # default). This target compiles far more of those headers than Task 3's did.
        CLANG_CXX_LANGUAGE_STANDARD: gnu++20
        MACOSX_DEPLOYMENT_TARGET: "26.0"
        # CEF's own libcef_dll/CMakeLists.txt:842 — "Creating the CEF wrapper library. Do not
        # define this for dependent targets." PRIVATE to this target only: Xcode/xcodegen build
        # settings do not propagate across a target dependency edge (unlike CMake's PUBLIC/
        # INTERFACE), so simply not repeating this on the five helper targets below already
        # matches CMake's PRIVATE semantic — nothing extra to do to keep it scoped.
        GCC_PREPROCESSOR_DEFINITIONS:
          - $(inherited)
          - WRAPPING_CEF_SHARED=1
      configs:
        Release:
          # C++ half of the Winter/WinterHelper targets' Release privacy-scrub block (their
          # OTHER_SWIFT_FLAGS -file-prefix-map has no effect on this target — it has no Swift).
          # LOAD-BEARING, not belt-and-suspenders: libcef_dll/base/cef_logging.cc and other
          # wrapper sources bake __FILE__ into string literals, which STRIP_STYLE cannot remove
          # after the fact — only the compiler flag stops the builder's home path from ever being
          # written into the object file in the first place.
          # No OTHER_LDFLAGS -oso_prefix here: a static library has no link step of its own — the
          # .a's member objects' OSO stabs get resolved at the LINKING target's link step (the
          # five helper targets below, which each set it), not here.
          OTHER_CPLUSPLUSFLAGS: -ffile-prefix-map=$(HOME)=/builder
  # panel-cef Task 4 — the five out-of-process helper bundles. Every shared line lives ONCE, in
  # the `CEFHelper` targetTemplate near the bottom of this file (Task 5): read that for the whole
  # rationale — bundle naming, the exact nested path CEF requires, the shared Info.plist, C++20,
  # CEF_USE_SANDBOX, and the Release privacy-scrub block. Each target below carries ONLY what
  # genuinely differs between the five.
  #
  # Why a template (panel-cef Task 5): Task 4 left an identical ~30-line settings block repeated
  # five times, and Task 5's own edit is exactly the change that block makes dangerous — an
  # entitlement (or a hardening flag, or a sandbox define) applied to four of five and nobody
  # noticing, because the four-of-five case looks exactly like the five-of-five case in a diff.
  # With the template, "shared" and "per-variant" are structurally distinct: anything that must
  # differ is a templateAttribute, and anything else CANNOT diverge by omission.
  CEFHelperBase:
    templates: [CEFHelper]
    templateAttributes:
      productName: "Winter Helper"
      bundleId: com.winter.app.cefhelper
  CEFHelperAlerts:
    templates: [CEFHelper]
    templateAttributes:
      productName: "Winter Helper (Alerts)"
      bundleId: com.winter.app.cefhelper.alerts
  # panel-cef Task 6a: `allow-jit` ADDED HERE, on the evidence Task 5 said it would take.
  #
  # Task 5 gave the Renderer `allow-jit` and deliberately withheld it from GPU despite Chrome
  # shipping it on both, naming GPU "the FIRST suspect if Task 6's GPU process dies". Task 5's own
  # review then pointed out that this Mac could never produce that evidence: the JIT user in
  # Chromium's GPU process is **SwiftShader** (`libvk_swiftshader.dylib`, which this build ships),
  # and an Apple Silicon Mac with a working Metal path never reaches it. So Task 6a forced the
  # software path deliberately and measured all four cells:
  #
  #   hardened runtime + Metal (default)   -> gpu-process runs in `Winter Helper.app` (BASE), 0 crashes
  #   hardened runtime + --use-angle=swiftshader
  #                                        -> gpu-process moves to `Winter Helper (GPU).app` and
  #                                           CRASH-LOOPS: repeated
  #                                           "GPU process exited unexpectedly: exit_code=9", and the
  #                                           crash report reads
  #                                           "termination": {"namespace":"CODESIGNING",
  #                                                           "indicator":"Invalid Page"}
  #                                           — the kernel killing it for executing a page it is not
  #                                           entitled to map. That is precisely MAP_JIT without
  #                                           `com.apple.security.cs.allow-jit`.
  #   Debug (no hardened runtime) + swiftshader -> survives; proves nothing, because the entitlement
  #                                           is only enforced under the hardened runtime.
  #
  # The routing is the part that makes this invisible without forcing it: Chromium sends the GPU
  # process to the `(GPU)` helper bundle ONLY when it needs the JIT-capable variant. On a Mac with a
  # working Metal path that bundle is never launched at all, so the missing entitlement cannot be
  # observed — it lands on a user with a blocklisted GPU, in a VM, or on a software-fallback page.
  #
  # `com.apple.security.cs.allow-jit` and nothing else, matching what Chrome 151 ships on its own
  # GPU helper (measured locally in Task 5). Both JIT-needing helpers share ONE entitlements file
  # (`Support/CEFHelperJit.entitlements`) rather than carrying two identical copies — the same
  # anti-drift reasoning as the `CEFHelper` targetTemplate below: two files with the same content
  # is exactly the shape where one gets edited and the other does not.
  #
  # SECOND FILE, NOT OPTIONAL: `scripts/release.ts`'s `HARDENING_PINS` asserts the entitlement set
  # of every signed component in BOTH directions, so an entitlement added here and not there fails
  # the release gate closed. That pin is the reason this is a two-file change.
  CEFHelperGPU:
    templates: [CEFHelper]
    templateAttributes:
      productName: "Winter Helper (GPU)"
      bundleId: com.winter.app.cefhelper.gpu
    entitlements:
      path: Support/CEFHelperJit.entitlements
      properties:
        com.apple.security.cs.allow-jit: true
  CEFHelperPlugin:
    templates: [CEFHelper]
    templateAttributes:
      productName: "Winter Helper (Plugin)"
      bundleId: com.winter.app.cefhelper.plugin
  # One of TWO helpers with an entitlement (panel-cef Task 6a added GPU's — see its block above for
  # the measurement that earned it). `com.apple.security.cs.allow-jit` remains the only entitlement
  # this branch adds anywhere: the app, the other three helpers and WinterHelper all ship
  # entitlement-free under the hardened runtime, which is where Task 5 deliberately started.
  #
  # `com.apple.security.cs.allow-jit` — V8 compiles JavaScript to native code at runtime, which
  # under the hardened runtime requires an MAP_JIT mapping, which requires this entitlement.
  # Evidence, measured on this machine rather than recalled — /Applications/Google Chrome.app,
  # `codesign -d --entitlements`, Chromium 151 era, the same Chromium this CEF wraps:
  #     Helper (Renderer)  -> allow-jit, and nothing else
  #     Helper (GPU)       -> allow-jit, and nothing else
  #     Helper (Plugin)    -> no entitlements
  #     Helper (Alerts)    -> no entitlements
  #     Helper (base)      -> no entitlements
  #     Google Chrome.app  -> device/permission entitlements only; NO allow-jit, and NO
  #                           com.apple.security.cs.disable-library-validation anywhere in the
  #                           whole bundle.
  # That last line is the load-bearing one for this branch: upstream Chromium ships a
  # notarized, hardened-runtime browser with no library-validation escape, which is why Task 5
  # did not add one (see the "Embed CEF framework" script's comment for the measured A/B that
  # confirms same-Team-ID nested signing is sufficient).
  #
  # Task 5 withheld `allow-jit` from GPU under its "only what a signed run proves necessary" rule,
  # naming it the first suspect if Task 6's GPU process died. **It died, and it now has one** —
  # Task 6a forced the software-rendering path and got the crash as evidence (CEFHelperGPU above).
  # The discipline worked exactly as intended: the entitlement was added when, and only when, a
  # measurement demanded it.
  CEFHelperRenderer:
    templates: [CEFHelper]
    templateAttributes:
      productName: "Winter Helper (Renderer)"
      bundleId: com.winter.app.cefhelper.renderer
    entitlements:
      path: Support/CEFHelperJit.entitlements
      properties:
        com.apple.security.cs.allow-jit: true
targetTemplates:
  # panel-cef Task 5 — the single definition of a CEF helper bundle. All five targets above
  # (CEFHelperBase / Alerts / GPU / Plugin / Renderer) are this template plus two attributes,
  # so no shared setting can be present on four of them and missing on the fifth.
  #
  # ---- carried verbatim from Task 4, which wrote all of this five times ----
  # CEF's own cmake/cef_variables.cmake:398-404 defines CEF_HELPER_APP_SUFFIXES as base, Alerts,
  # GPU, Plugin, Renderer (docs/research/2026-08-09-cef-spike.md, correction #1 — an earlier plan
  # draft said four; wrong). All five share ONE source file (CEFHelperSources/process_helper_mac.cc
  # — CEF's own build does the same: one process_helper_mac.cc compiled five times) and differ ONLY
  # in PRODUCT_NAME / PRODUCT_BUNDLE_IDENTIFIER (and, since Task 5, the Renderer's one entitlement).
  # Xcode preserves spaces AND parentheses verbatim in PRODUCT_NAME for the actual Contents/MacOS/
  # executable filename (confirmed real-world precedent: shipped Chromium-family apps ship exactly
  # "...Helper (GPU).app/Contents/MacOS/...Helper (GPU)") — the brief's path is exact and this
  # reproduces it exactly, not approximately. The xcodegen TARGET NAMEs stay plain identifiers on
  # purpose (no spaces/parens) — deliberately decoupled from PRODUCT_NAME, which carries the
  # required display/path string instead — and deliberately NOT "WinterHelper*", to avoid the exact
  # near-namesake confusion Task 3 called out for NSPrincipalClass: these are unrelated to
  # WinterHelper (the SMAppService launchd daemon target) and unrelated to WinterCEF (Task 6's
  # planned bridge target name).
  #
  # Info.plist: ONE shared generated-but-tracked file (Support/CEFHelperInfo.plist — a NEW instance
  # of the "Info.plist keys live in two tracked places" pattern Task 3 carried forward: project.yml
  # here, the generated file there), referenced by all five targets. This works because xcodegen's
  # `info.properties` values are build-setting REFERENCES ($(PRODUCT_NAME),
  # $(PRODUCT_BUNDLE_IDENTIFIER)) resolved per-target at Info.plist preprocessing time — exactly how
  # the main Winter target's own Info.plist already resolves $(WINTER_APP_NAME) — so one file
  # legitimately produces five different compiled Info.plists. Keys match the REAL helper Info.plist
  # docs/research/2026-08-09-cef-spike.md measured (Q3) on CEF's own built "cefsimple Helper.app"
  # byte-for-byte, not invented: CFBundleIdentifier, LSMinimumSystemVersion, LSUIElement,
  # LSFileQuarantineEnabled, NSSupportsAutomaticGraphicsSwitching, and LSEnvironment.MallocNanoZone=0
  # (a known Chromium-on-macOS allocator requirement for helper processes). CFBundleExecutable is
  # deliberately absent — Xcode auto-derives it from PRODUCT_NAME regardless, matching the main Winter
  # target's own Info.plist, which also never lists it.
  CEFHelper:
    type: application
    platform: macOS
    sources:
      - path: CEFHelperSources/process_helper_mac.cc
    dependencies:
      - target: CefDllWrapper
    info:
      path: Support/CEFHelperInfo.plist
      properties:
        CFBundleIdentifier: "$(PRODUCT_BUNDLE_IDENTIFIER)"
        LSMinimumSystemVersion: "26.0"
        LSUIElement: true
        LSFileQuarantineEnabled: true
        NSSupportsAutomaticGraphicsSwitching: true
        LSEnvironment:
          MallocNanoZone: "0"
    settings:
      base:
        PRODUCT_NAME: "${productName}"
        PRODUCT_BUNDLE_IDENTIFIER: "${bundleId}"
        # Overridden wholesale by scripts/release.ts's xcodebuild invocation
        # (CODE_SIGN_IDENTITY="Developer ID Application" DEVELOPMENT_TEAM=… CODE_SIGN_STYLE=Manual
        # ENABLE_HARDENED_RUNTIME=YES OTHER_CODE_SIGN_FLAGS=--timestamp), which applies to every
        # target in the scheme — same as the Winter target's own identical base setting. This value
        # is what a local dev build uses, nothing more.
        CODE_SIGN_IDENTITY: "Apple Development"
        DEVELOPMENT_TEAM: 37N77U9RSZ
        CODE_SIGN_STYLE: Manual
        MACOSX_DEPLOYMENT_TARGET: "26.0"
        HEADER_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/vendor/cef
          # editor-plumbing Task 2: `Sources/CEF/WinterEditorScheme.h` — the ONE place the
          # `winter-editor://` scheme's name and option flags are written. These five helper
          # processes must register the identical scheme the browser process does (`cef_app.h`:
          # "the registered schemes should be the same across all processes"), and a second copy of
          # the flags in `process_helper_mac.cc` would drift from `WinterApp`'s the first time
          # either changed, silently — no test in this repo can boot CEF to notice. One template
          # entry covers all five targets, which is the whole point of the template.
          # Array form, like the two entries above it: this checkout's SRCROOT contains a space,
          # and each array element reaches Xcode as one already-quoted path (see the Winter
          # target's own HEADER_SEARCH_PATHS comment for the quoting trap this avoids).
          - $(SRCROOT)/Sources/CEF
        # CEF 151's public headers require C++20 — measured, not assumed (Task 3):
        # cef_scoped_refptr.h:101 uses std::same_as, and a probe compile at gnu++17 fails there
        # with 20 errors. xcodegen's setting preset leaves the project on gnu++14, same failure.
        CLANG_CXX_LANGUAGE_STANDARD: gnu++20
        # Client-side-only (grepped: absent from every vendored CEF header and every libcef_dll
        # source), so this can be defined here without affecting the wrapper library's own build.
        # Gates CefScopedSandboxContext in process_helper_mac.cc exactly as CEF's own upstream
        # source gates it — see that file's header comment. Task 4's review found that deleting it
        # from all five targets compiles, links, and leaves the suite green while silently
        # producing UNSANDBOXED renderer processes; it is not runtime-pinnable until Task 6.
        GCC_PREPROCESSOR_DEFINITIONS:
          - $(inherited)
          - CEF_USE_SANDBOX=1
      configs:
        Release:
          # Same privacy-scrub reasoning as CefDllWrapper's Release config, plus the half that only
          # applies to a target with an actual link step: OTHER_LDFLAGS -oso_prefix strips OSO stabs
          # recorded at THIS link (covering both this target's own object file and every object
          # CefDllWrapper.a contributes), and DEPLOYMENT_POSTPROCESSING + STRIP_INSTALLED_PRODUCT +
          # STRIP_STYLE match Winter/WinterHelper's own Release blocks exactly — these five are
          # shipped binaries too.
          OTHER_CPLUSPLUSFLAGS: -ffile-prefix-map=$(HOME)=/builder
          OTHER_LDFLAGS: -Wl,-oso_prefix,$(HOME)/
          DEPLOYMENT_POSTPROCESSING: YES
          STRIP_INSTALLED_PRODUCT: YES
          STRIP_STYLE: debugging
schemes:
  # The helper alone — what `bun run dev:helper` and `bun run verify:computer-helper` build, so neither
  # pays for CEF, LibreOffice or the app.
  WinterComputerUse:
    build:
      targets:
        WinterComputerUse: all
  # Winter Headless alone — what `bun run dev:headless` builds — and its logic tests.
  WinterHeadless:
    build:
      targets:
        WinterHeadless: all
        WinterHeadlessTests: [test]
    test:
      targets: [WinterHeadlessTests]
