[package]
name = "clover-link"
version = "0.0.0"
edition = "2021"
publish = false
license = "Apache-2.0"
description = "clover-core's link sidecar: one iroh endpoint per device, driven over stdin and stdout (spec §8.2)"

[[bin]]
name = "clover-link"
path = "src/main.rs"

[dependencies]
anyhow = "1"
tokio = { version = "1", features = ["full"] }
serde_json = "1"
# The iroh S1 chose (docs/research/2026-11-05-s1-transport.md), with the net report for the two-STUN mapping check.
iroh = { version = "=1.4.1", features = ["unstable-net-report"] }
# For the connection's path stream (`StreamExt`); the version iroh 1.4.1 uses.
n0-future = "=0.3.2"

[profile.release]
opt-level = 3
debug = false
codegen-units = 16
lto = false
