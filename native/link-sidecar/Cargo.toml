[package]
name = "clover-link-sidecar"
version = "0.0.0"
edition = "2021"
publish = false
license = "Apache-2.0"
description = "Spike S1 prototype: quinn and iroh peers, a STUN responder, and a stdio sidecar for clover-core"

[[bin]]
name = "clover-link-sidecar"
path = "src/main.rs"

[dependencies]
anyhow = "1"
tokio = { version = "1", features = ["full"] }
serde_json = "1"
# Plain QUIC. rustls with ring, so no C toolchain beyond the system one is needed on Windows.
quinn = { version = "=0.11.12", default-features = false, features = ["runtime-tokio", "rustls-ring", "log"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging"] }
rcgen = { version = "0.14", default-features = false, features = ["ring", "crypto"] }
ring = "0.17"
# The same iroh the napi binding @number0/iroh 1.2.0 is locked to (iroh-ffi v1.2.0 Cargo.lock).
# `unstable-net-report` only exposes the net report, so the relay lab can show what QAD learned.
iroh = { version = "=1.4.1", features = ["unstable-net-report"] }
# Only for noq's congestion controller configs (BBRv3), which iroh does not re-export.
noq-proto = "=1.4.0"
# The relay map's QUIC address-discovery config for the lab relay, and with the `relay-server`
# feature the relay itself (nat/matrix.sh's relay phase). The same version iroh uses.
iroh-relay = { version = "=1.4.1", default-features = false, features = ["tls-ring"] }

[features]
# A local iroh relay for the netns lab: `clover-link-sidecar relay-server`.
relay-server = ["iroh-relay/server"]

[profile.release]
opt-level = 3
debug = false
codegen-units = 16
lto = false
